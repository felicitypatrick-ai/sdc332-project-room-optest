name: Course kit

# SDC332 course kit. Paste this file once, then run it from the Actions tab.
# Each step writes files or branches in this repository only.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which kit step to run"
        required: true
        type: choice
        options:
          - start
          - team-update
          - releases
          - speed-up
      app:
        description: "Starter app (start step only)"
        required: false
        type: choice
        default: pantry
        options:
          - pantry
          - bike
          - room
          - own
      card:
        description: "Card number from your instructor (leave blank if you were not given one)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the kit step
        shell: bash
        env:
          STEP: ${{ inputs.step }}
          APP: ${{ inputs.app }}
          WHO: ${{ github.actor }}
          CARD: ${{ inputs.card }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
