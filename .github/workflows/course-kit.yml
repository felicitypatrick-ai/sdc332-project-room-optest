          import base64, gzip, hashlib, json, os, subprocess, sys
          data = json.loads(gzip.decompress(base64.b64decode(open("/tmp/kit.b64").read().replace(" ", "").replace("\n", ""))))
          step, who = os.environ["STEP"], os.environ["WHO"]
          D = data["D"]; exec(data["g"])
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          def say(t): print(t); out.write(t + "\n\n")
          def git(*a): subprocess.run(["git", *a], check=True)
          def write(p, t):
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True); open(p, "w").write(t)
          def change(items):
              for p, old, new in items:
                  if old is None:
                      write(p, new); continue
                  t = open(p).read() if os.path.exists(p) else ""
                  if old not in t:
                      say(f"Stop: the kit could not update {p}, because that file is not as the starter left it. Ask your instructor.")
                      sys.exit(1)
                  write(p, t.replace(old, new, 1))
          if step == "start":
              if os.path.exists("course/card.json"):
                  say("Your starter app is already here. Nothing changed."); sys.exit(0)
              c = (os.environ.get("CARD") or "").strip()
              if c and not (c.isdigit() and 1 <= int(c) <= D["N"]):
                  say(f"Stop: the card number must be a whole number from 1 to {D['N']}. Nothing changed."); sys.exit(1)
              n = int(c) if c else int(hashlib.sha256(who.lower().encode()).hexdigest(), 16) % D["N"] + 1
              app = os.environ.get("APP") or "pantry"
              facts, s, e, rel, v = card(D, app, n)
              for p, t in D[app].get("f", {}).items(): write(p, t)
              write("course/card.json", json.dumps(facts, indent=2, sort_keys=True) + "\n"); change(s)
              git("add", "-A"); git("commit", "-q", "-m", "Add the team card" if app == "own" else "Add the starter app and team card"); git("push", "-q", "origin", "HEAD:main")
              say(f"Done: your team card (card {n}) is on main" + ("" if app == "own" else ", with the starter app") + ". Open course/card.json to read your team's facts.")
              sys.exit(0)
          cj = json.load(open("course/card.json")) if os.path.exists("course/card.json") else None
          if not cj:
              say("Stop: run the start step first."); sys.exit(1)
          name = next((a for a in ("pantry", "bike", "room") if D[a]["m"]["title"] == cj.get("app")), None)
          if not name:
              say("Stop: this step works on a course starter app. For your own project, your instructor gives you this week's changes."); sys.exit(1)
          facts, s, e, rel, v = card(D, name, int(cj["card"]))
          if step == "team-update":
              git("checkout", "-q", "-b", "team-update")
              for p, t in D[name]["n"].items(): write(p, t)
              change(e)
              git("add", "-A"); git("commit", "-q", "-m", "Add the team's update: " + D[name]["m"]["up"]); git("push", "-q", "-f", "origin", "team-update")
              say("Done: the team's update is on branch team-update. Open a pull request from team-update into main to start its checks.")
          elif step == "releases":
              base = "main"
              for v, items in rel:
                  git("checkout", "-q", base); git("checkout", "-q", "-B", f"release-{v}"); base = f"release-{v}"
                  change(items)
                  git("add", "-A"); git("commit", "-q", "-m", f"Release {v}"); git("push", "-q", "-f", "origin", f"release-{v}")
              say("Done: branches release-1.1, release-1.2 and release-1.3 are ready. Send each one in order: open its pull request into main and merge it.")
          PY
