name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Write test results to run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results"
            echo
            if [ -f test-results.txt ]; then
              echo '```'
              cat test-results.txt
              echo '```'
            else
              echo "Tests did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release package
        run: python scripts/package.py

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: room-build-card4321
          path: dist/
          retention-days: 7
          if-no-files-found: error

  rule-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [capacity, limit, line]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release package
        run: python scripts/package.py
      - name: Check the owner's rule
        run: python scripts/rule_check.py ${{ matrix.check }}
